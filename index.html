<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM Namo Narayanaya | Personal Song Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-section">
                <img src="images/narayana.jpg" alt="Logo" class="logo">
                <h1>OM Namo Narayanaya</h1>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search your song bank..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
        </header>

        <main>
            <div class="actions">
                <button id="playAllBtn" class="btn primary">▶ Play All</button>
                <button id="shuffleBtn" class="btn secondary">🔀 Shuffle</button>
            </div>

            <div id="songList" class="song-grid">
                <!-- Songs populated by JS -->
                <div class="loading">Loading your divine collection...</div>
            </div>

            <div id="pagination" class="pagination"></div>
        </main>

        <footer id="player" class="player hidden">
            <div class="player-inner">
                <div class="song-meta">
                    <div id="playerTitle" class="current-title">No song playing</div>
                </div>

                <div class="player-controls">
                    <div class="main-controls">
                        <button id="prevBtn" class="control-btn" title="Previous">⏮</button>
                        <button id="playPauseBtn" class="control-btn play-pause" title="Play/Pause">▶</button>
                        <button id="nextBtn" class="control-btn" title="Next">⏭</button>
                    </div>
                    
                    <div class="progress-container">
                        <span id="currentTime" class="time">0:00</span>
                        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
                        <span id="totalTime" class="time">0:00</span>
                    </div>
                </div>

                <div class="extra-controls">
                    <div class="volume-container">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volumeBar" value="80" min="0" max="100">
                    </div>
                    <button id="closePlayer" class="close-btn" title="Close Player">✕</button>
                </div>
            </div>
        </footer>
    </div>

    <audio id="audioElement"></audio>
    <script src="script.js"></script>
</body>
</html>
