<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OM Namo Narayanaya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <img src="images/narayana.jpg" alt="Logo" class="logo-img">
            <h1>OM Namo Narayanaya</h1>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Search for songs..." oninput="searchSongs()">
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="playAll()">▶️ Play All</button>
            <button class="btn btn-secondary" onclick="stopAll()">⏹️ Stop</button>
            <button class="btn btn-secondary" onclick="shufflePlay()">🔀 Shuffle</button>
        </div>
        
        <div class="song-list" id="songList">
            <!-- Songs will be populated here -->
        </div>
        
        <div class="pagination" id="pagination">
            <!-- Pagination will be populated here -->
        </div>
    </div>
    
    <div class="audio-player" id="audioPlayer">
        <div class="player-content">
            <button class="btn btn-secondary" id="prevBtn" title="Previous Song">⏮️</button>
            <button class="btn btn-secondary" id="rewindBtn" title="Rewind 10s">⏪</button>
            <button class="btn btn-secondary" id="playPauseBtn" title="Play/Pause">▶️</button>
            <button class="btn btn-secondary" id="forwardBtn" title="Forward 10s">⏩</button>
            <button class="btn btn-secondary" id="nextBtn" title="Next Song">⏭️</button>
            <div class="now-playing" id="nowPlaying">No song playing</div>
            <audio id="audioElement" controls style="flex: 1; display:none;">
                Your browser does not support the audio element.
            </audio>
            <input type="range" id="seekBar" value="0" min="0" max="100" step="1" style="width:150px;">
            <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
            <button class="btn btn-secondary" onclick="closePlayer()">✕</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Dynamically load and update song durations
        document.addEventListener('DOMContentLoaded', function() {
            if (window.allSongs) {
                window.allSongs.forEach(song => {
                    if (!song.duration) {
                        const audio = new Audio(song.file);
                        audio.addEventListener('loadedmetadata', () => {
                            const minutes = Math.floor(audio.duration / 60);
                            const seconds = Math.floor(audio.duration % 60).toString().padStart(2, '0');
                            song.duration = `${minutes}:${seconds}`;
                            if (typeof window.displaySongs === 'function') window.displaySongs();
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
